<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Builder overwrites these per page -->
  <title></title>
  <meta name="description" content="" />
  <link rel="canonical" href="" />

  <!--
    Toyota-specific brand-lineup (pillar) template.
    Direct copy of brand-lineup.html so existing Toyota lineup pages
    continue to render the same while we standardize template names.
  -->
  <style>
    .tto-scope {
      all: initial;
      display: block;
      --tto-accent: #EB0A1E;
      --tto-ink: #111827;
      --tto-black: #000000;
      --tto-muted: #6b7280;
      --tto-bg: #ffffff;
      --tto-surface: #f3f4f6;
      --tto-line: rgba(17, 24, 39, .12);
      --tto-shadow: 0 10px 26px rgba(0, 0, 0, .10);
      --tto-radius: 12px;
      --tto-font: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --tto-hfont: var(--tto-font);
      font-family: var(--tto-font);
      color: var(--tto-ink);
      background: var(--tto-bg);
    }

    .tto-scope *,
    .tto-scope *::before,
    .tto-scope *::after {
      box-sizing: border-box;
    }

    .tto-scope img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .tto-scope a {
      color: inherit;
      text-decoration: none;
    }

    .tto-scope strong {
      font-weight: 700;
    }

    .tto-scope p {
      margin: 12px 0;
      line-height: 1.6;
      color: var(--tto-ink);
    }

    .tto-scope ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tto-scope h1,
    .tto-scope h2,
    .tto-scope h3 {
      margin: 0;
      font-family: var(--tto-hfont);
    }

    .tto-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 18px 34px;
    }

    .tto-hero {
      position: relative;
      border-radius: var(--tto-radius);
      overflow: hidden;
      box-shadow: var(--tto-shadow);
      background: radial-gradient(circle at top left, #1f2937, #000000);
      color: #ffffff;
    }

    .tto-hero-inner {
      position: relative;
      padding: 26px 22px 26px;
    }

    @media (min-width:980px) {
      .tto-hero-inner {
        padding: 34px 30px;
      }
    }

    .tto-kicker {
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 0 0 10px;
      color: rgba(255, 255, 255, .85) !important;
    }

    .tto-h1 {
      font-size: 34px;
      line-height: 1.1;
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 1) !important;
    }

    @media (max-width:520px) {
      .tto-h1 {
        font-size: 28px;
      }
    }

    .tto-subhead {
      font-size: 15px;
      margin: 0 0 18px;
      max-width: 72ch;
      color: rgba(255, 255, 255, .88) !important;
    }

    .tto-hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tto-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      text-decoration: none !important;
    }

    .tto-btn-primary {
      background: var(--tto-accent);
      color: #fff !important;
    }

    .tto-btn-outline {
      background: #fff;
      border-color: var(--tto-line);
      color: var(--tto-ink) !important;
    }

    .tto-hero-fine {
      margin: 10px 0 0;
      font-size: 12px;
      opacity: .9;
      color: rgba(255, 255, 255, .85) !important;
    }

    .tto-main {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tto-card {
      background: var(--tto-bg);
      border: 1px solid var(--tto-line);
      border-radius: 10px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .03);
      padding: 18px;
    }

    .tto-card-muted {
      background: var(--tto-surface);
    }

    .tto-h2 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 10px !important;
    }

    .tto-h2-sm {
      font-size: 18px;
    }

    .tto-body {
      color: var(--tto-muted);
    }

    body {
      margin: 0;
      background: #fafafa;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .tto-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 12px;
    }

    @media (min-width: 640px) {
      .tto-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 980px) {
      .tto-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .tto-grid-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .tto-grid-card-media {
      margin: -4px -4px 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--tto-line);
      background: #e5e7eb;
    }

    .tto-grid-card-media img {
      width: 100%;
      height: auto;
      display: block;
    }

    .tto-grid-card-title {
      font-size: 18px;
      line-height: 1.3;
      margin: 0;
    }

    .tto-grid-card .tto-body {
      margin: 0;
      line-height: 1.55;
      min-height: 4.26em;
    }

    .tto-grid-card-footer {
      display: flex;
      justify-content: flex-start;
      margin-top: auto;
      padding-top: 4px;
    }

    .tto-grid-card-footer .tto-btn {
      min-width: 0;
    }
  </style>

  <!-- Builder injects JSON here -->
</head>

<body>
  <section class="tto-scope" data-template="brand-lineup">
    <div class="tto-page">

      <header class="tto-hero">
        <div class="tto-hero-inner">
          <p class="tto-kicker" data-tto="kicker">2026 MODEL YEAR LINEUP</p>
          <h1 class="tto-h1" data-tto="h1"></h1>
          <p class="tto-subhead" data-tto="heroSubhead"></p>
          <div class="tto-hero-actions">
            <a class="tto-btn tto-btn-primary" data-tto="inventoryAnchorHref" href="#inventory">View New Inventory</a>
            <a class="tto-btn tto-btn-outline" data-tto="leadHref" href="#tto_leadform">Get Pricing</a>
          </div>
          <p class="tto-hero-fine" data-tto="heroFine"></p>
        </div>
      </header>

      <main class="tto-main">
        <section class="tto-card">
          <h2 class="tto-h2" data-tto="modelsHeading"></h2>
          <p class="tto-body" data-tto="modelsIntro"></p>
          <div class="tto-grid" data-tto="cards"></div>
        </section>
      </main>
    </div>
  </section>
  <!-- TTO_MICRODATA_INJECT -->
</body>

</html>
