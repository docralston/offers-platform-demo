<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { {brand-css-vars} }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {width}px;
        height: {height}px;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      .banner--970x250 {
        width: {width}px;
        height: {height}px;
        display: grid;
        grid-template-rows: 1fr auto;
        background: linear-gradient(112deg, var(--theme-bg-1, #0a0c10) 0%, var(--theme-bg-2, #111827) 55%, var(--theme-bg-3, #0b0e14) 100%);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .banner--970x250 .stage {
        display: grid;
        grid-template-columns: 430px 370px 170px;
        min-height: 0;
      }
      .banner--970x250 .visual {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(105% 82% at 22% 36%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.1) 62%, rgba(255, 255, 255, 0) 80%),
          radial-gradient(78% 62% at 80% 74%, rgba(203, 213, 225, 0.82) 0%, rgba(203, 213, 225, 0.05) 72%, rgba(203, 213, 225, 0) 86%),
          radial-gradient(92% 92% at 92% 14%, rgba(241, 245, 249, 0.9) 0%, rgba(241, 245, 249, 0) 74%),
          linear-gradient(140deg, #f8fafc 0%, #e5e7eb 48%, #cbd5e1 100%);
      }
      .banner--970x250 .visual::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.22;
        background-image:
          radial-gradient(rgba(15, 23, 42, 0.28) 0.9px, transparent 0.9px),
          radial-gradient(rgba(255, 255, 255, 0.35) 0.85px, transparent 0.85px);
        background-size: 4px 4px, 6px 6px;
        background-position: 0 0, 1px 1px;
        mix-blend-mode: soft-light;
        pointer-events: none;
      }
      .banner--970x250 .visual img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 50% 52%;
        display: block;
        padding: 10px 14px;
        filter:
          drop-shadow(0 6px 12px rgba(15, 23, 42, 0.22))
          drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
      }
      .banner--970x250 .visual-scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0%,
          rgba(255, 255, 255, 0.03) 68%,
          color-mix(in srgb, var(--theme-bg-2, #111827) 26%, rgba(17, 24, 39, 0.1)) 100%
        );
        pointer-events: none;
      }
      .banner--970x250 .content {
        padding: 18px 20px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        justify-content: center;
        background: var(--theme-bg-2, #111827);
        min-width: 0;
      }
      .banner--970x250 .headline {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
        color: var(--theme-headline, #f8fafc);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .banner--970x250 .msrp-line {
        margin: 0;
        font-size: 12px;
        line-height: 1.2;
        color: var(--theme-copy, rgba(248, 250, 252, 0.82));
      }
      .banner--970x250 .offers {
        display: grid;
        gap: 6px;
        margin-top: 2px;
      }
      .banner--970x250 .offer {
        border: 1px solid var(--theme-panel-border, rgba(255, 255, 255, 0.14));
        border-radius: 7px;
        padding: 7px 10px;
        background: var(--theme-panel, rgba(255, 255, 255, 0.06));
      }
      .banner--970x250 .offer-top {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: auto auto;
        align-items: center;
        gap: 8px;
      }
      .banner--970x250 .offer-main { display: contents; }
      .banner--970x250 .pill {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .banner--970x250 .pill-lease {
        background: rgba(14, 165, 233, 0.2);
        color: #7dd3fc;
        border: 1px solid rgba(14, 165, 233, 0.35);
      }
      .banner--970x250 .pill-finance {
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .banner--970x250 .price {
        display: block;
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: var(--theme-price, #ffffff);
        line-height: 1;
      }
      .banner--970x250 .offer-sub,
      .banner--970x250 .offer-sub-line {
        display: inline;
        grid-column: 1 / -1;
        grid-row: 2;
        font-size: 10px;
        color: var(--theme-copy, rgba(248, 250, 252, 0.78));
        line-height: 1.22;
        text-align: right;
      }
      .banner--970x250 .offer-sub { display: block; margin-top: 2px; }
      .banner--970x250 .rail {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
        justify-content: center;
        padding: 14px 12px;
        background: var(--theme-bg-3, #0b0e14);
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
      .banner--970x250 .dealer {
        margin: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        line-height: 1.14;
        text-transform: uppercase;
        text-align: center;
        color: var(--theme-copy, rgba(248, 250, 252, 0.9));
        white-space: pre-line;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .banner--970x250 .cta-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        border-radius: 6px;
        background: var(--theme-cta-bg, #ffffff);
        color: var(--theme-cta-fg, #0f172a);
        border: 1px solid rgba(15, 23, 42, 0.14);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
      }
      .banner--970x250 .legal {
        font-size: 9px;
        line-height: 1.22;
        color: rgba(248, 250, 252, 0.5);
        padding: 7px 14px 9px;
        background: rgba(0, 0, 0, 0.55);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
    </style>
  </head>
  <body>
    <article class="banner banner--970x250">
      <div class="stage">
        <div class="visual">
          <img src="{vehicle-image}" alt="{title}" />
          <div class="visual-scrim"></div>
        </div>
        <div class="content">
          <h1 class="headline">{title}</h1>
          <p class="msrp-line">{msrp}</p>
          <div class="offers">{offers}</div>
        </div>
        <div class="rail">
          <p class="dealer">{store-name}</p>
          <div class="cta-btn">{cta}</div>
        </div>
      </div>
      <div class="legal" {disclaimer-style}>{disclaimer}</div>
    </article>
  </body>
</html>
