<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { {brand-css-vars} }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {width}px;
        height: {height}px;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: var(--bg);
      }
      .banner {
        width: {width}px;
        height: {height}px;
        border: 1px solid var(--border);
        display: grid;
        grid-template-rows: 40% 1fr auto;
        overflow: hidden;
      }
      .banner.banner--no-vehicle {
        grid-template-rows: 1fr auto;
      }
      .banner.banner--no-vehicle .media {
        display: none !important;
      }
      .media {
        background: linear-gradient(130deg, var(--media-from), var(--media-to));
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .media img { width: 100%; height: 100%; object-fit: contain; }
      .content {
        min-width: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--text);
      }
      .title {
        margin: 0;
        font-size: 24px;
        line-height: 1.05;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .msrp { margin: 0; font-size: 12px; color: var(--muted); }
      .offers { display: grid; gap: 6px; }
      .offer {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.75);
        padding: 6px;
      }
      .offer-top { display: flex; justify-content: space-between; gap: 6px; }
      .offer-main { text-align: right; }
      .price { font-size: 18px; font-weight: 800; white-space: nowrap; }
      .offer-sub, .offer-sub-line { font-size: 10px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
      .pill {
        font-size: 10px;
        font-weight: 700;
        border: 1px solid;
        padding: 2px 6px;
        height: fit-content;
      }
      .pill-lease { background: var(--pill-lease-bg); color: var(--pill-lease-fg); border-color: var(--pill-lease-border); }
      .pill-finance { background: var(--pill-finance-bg); color: var(--pill-finance-fg); border-color: var(--pill-finance-border); }
      .cta {
        margin-top: auto;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--theme-cta-bg, var(--cta));
        color: var(--theme-cta-fg, #fff);
        font-weight: 800;
        font-size: 13px;
      }
      .disclaimer {
        border-top: 1px solid var(--border);
        background: rgba(255,255,255,0.85);
        color: var(--muted);
        text-align: left;
        font-size: 8px;
        line-height: 1.2;
        padding: 5px 8px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
    </style>
  </head>
  <body>
    <article class="banner{banner-extra-class}">
      <div class="media" {vehicle-style}><img src="{vehicle-image}" alt="{title}" /></div>
      <div class="content">
        <h1 class="title">{title}</h1>
        <p class="msrp">{msrp}</p>
        <div class="offers">{offers}</div>
        <div class="cta">{cta}</div>
      </div>
      <div class="disclaimer" {disclaimer-style}>{disclaimer}</div>
    </article>
  </body>
</html>
