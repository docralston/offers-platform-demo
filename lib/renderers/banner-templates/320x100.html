<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { {brand-css-vars} }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {width}px;
        height: {height}px;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      .banner--320x100 {
        width: {width}px;
        height: {height}px;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        background: linear-gradient(100deg, var(--theme-bg-1, #0a0c10) 0%, var(--theme-bg-2, #111827) 55%, var(--theme-bg-3, #0b0e14) 100%);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .banner--320x100 .visual {
        position: relative;
        flex: 0 0 92px;
        overflow: hidden;
        background:
          radial-gradient(98% 82% at 30% 36%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.08) 65%, rgba(255, 255, 255, 0) 82%),
          radial-gradient(75% 60% at 80% 74%, rgba(203, 213, 225, 0.8) 0%, rgba(203, 213, 225, 0.05) 72%, rgba(203, 213, 225, 0) 86%),
          linear-gradient(140deg, #f8fafc 0%, #e5e7eb 48%, #cbd5e1 100%);
      }
      .banner--320x100 .visual::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.22;
        background-image:
          radial-gradient(rgba(15, 23, 42, 0.28) 0.7px, transparent 0.7px),
          radial-gradient(rgba(255, 255, 255, 0.35) 0.6px, transparent 0.6px);
        background-size: 3px 3px, 5px 5px;
        background-position: 0 0, 1px 1px;
        mix-blend-mode: soft-light;
        pointer-events: none;
      }
      .banner--320x100 .visual img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 54% center;
        display: block;
        padding: 2px;
        filter:
          drop-shadow(0 2px 4px rgba(15, 23, 42, 0.22))
          drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
      }
      .banner--320x100 .visual-scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0) 62%,
          color-mix(in srgb, var(--theme-bg-2, #111827) 22%, rgba(17, 24, 39, 0.08)) 100%
        );
        pointer-events: none;
      }
      .banner--320x100 .copy {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        background: var(--theme-bg-2, #111827);
      }
      .banner--320x100 .headline {
        margin: 0;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: var(--theme-headline, #f8fafc);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .banner--320x100 .offers {
        display: grid;
        gap: 3px;
      }
      .banner--320x100 .offer {
        border: 1px solid var(--theme-panel-border, rgba(255, 255, 255, 0.12));
        border-radius: 4px;
        padding: 3px 6px;
        background: var(--theme-panel, rgba(255, 255, 255, 0.06));
      }
      .banner--320x100 .offer + .offer { display: none; }
      .banner--320x100 .offer-top {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 6px;
      }
      .banner--320x100 .offer-main { display: contents; }
      .banner--320x100 .pill {
        font-size: 7px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 1px 4px;
        border-radius: 2px;
      }
      .banner--320x100 .pill-lease {
        background: rgba(14, 165, 233, 0.2);
        color: #7dd3fc;
        border: 1px solid rgba(14, 165, 233, 0.35);
      }
      .banner--320x100 .pill-finance {
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .banner--320x100 .price {
        display: block;
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--theme-price, #ffffff);
      }
      .banner--320x100 .offer-sub,
      .banner--320x100 .offer-sub-line { display: none; }
      .banner--320x100 .rail {
        flex: 0 0 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 7px;
        background: var(--theme-bg-3, #0b0e14);
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
      .banner--320x100 .cta-btn {
        width: 100%;
        text-align: center;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 4px;
        border-radius: 3px;
        background: var(--theme-cta-bg, #ffffff);
        color: var(--theme-cta-fg, #0f172a);
        border: 1px solid rgba(15, 23, 42, 0.14);
      }
      .banner--320x100 .legal { display: none; }
    </style>
  </head>
  <body>
    <article class="banner banner--320x100">
      <div class="visual">
        <img src="{vehicle-image}" alt="{title}" />
        <div class="visual-scrim"></div>
      </div>
      <div class="copy">
        <h1 class="headline">{title}</h1>
        <div class="offers">{offers}</div>
      </div>
      <div class="rail">
        <div class="cta-btn">{cta}</div>
      </div>
      <div class="legal" {disclaimer-style}>{disclaimer}</div>
    </article>
  </body>
</html>
